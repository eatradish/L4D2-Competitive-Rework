// ReadyUp Cvars
l4d_ready_cfg_name "BaoKang v1.0"

// Confogl Cvars
confogl_addcvar mp_gamemode "versus"  // Force Versus for the config.
confogl_addcvar z_difficulty "normal" // Force normal Difficulty to prevent co-op difficulty impacting the config.
confogl_addcvar confogl_pills_limit -1 // BaoKang: unlimited pain pills (vanilla) - Limits the number of pain pills on each map outside of saferooms. -1: no limit; >=0: limit to cvar value

// ZoneMod 4v4 Cvars
// BaoKang: common-infected spawn settings locked to VANILLA defaults
confogl_addcvar z_common_limit 30          // vanilla: max common infected alive at once
confogl_addcvar z_mega_mob_size 50         // vanilla default (mega mob size)
confogl_addcvar z_mob_spawn_min_size 10    // vanilla default (min mob/horde size)
confogl_addcvar z_mob_spawn_max_size 30    // vanilla default (max mob/horde size)
// z_mob_spawn_*_interval_normal left at engine defaults (vanilla ambient mobs enabled;
// competitive modes force 3600 to disable them)
// BaoKang: vanilla versus ghost delay (random 20-30) instead of zonemod's fixed 16
confogl_addcvar z_ghost_delay_min 20
confogl_addcvar z_ghost_delay_max 30
// BaoKang: hunter/tongue numbers left at vanilla defaults (zonemod overrides removed)

// BaoKang Shared Cvars (Zonemod fork with Tier2 big guns enabled)
exec cfgogl/baokang/shared_cvars.cfg

// Config Cvars
exec cfgogl/baokang/baokang.cfg