// BaoKang: universal plugins (left4dhooks/l4d2lib/predictable_unloader/playermanagement/
// bequiet/anticheat etc.) are loaded globally via cfg/generalfixes.cfg (server.cfg match chain).
// No competitive fix pack (cfg/compfixes.cfg) here - that is competitive modes only.

//-------------------------------------------
// BaoKang Shared Plugins
//-------------------------------------------
exec cfgogl/baokang/shared_plugins.cfg

//-------------------------------------------
// ZoneMod 4v4
//-------------------------------------------
sm plugins load optional/survivor_mvp.smx
sm plugins load optional/l4d2_antibaiter.smx
sm plugins load optional/l4d2_playstats.smx
sm plugins load optional/l4d2_skill_detect.smx
sm plugins load optional/autopause.smx
sm plugins load optional/l4d2_tongue_timer.smx
