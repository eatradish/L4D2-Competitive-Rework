// =======================================================================================
// Pure (纯净对抗) Shared Cvars
// Framework-only: server basics, rates, ReadyUp, confogl core. No gameplay tuning ->
// every gameplay cvar keeps the game's own (vanilla) default.
// =======================================================================================

// Server Cvars
sv_pure 2
sv_alltalk 0
confogl_addcvar sv_cheats 0
confogl_addcvar sv_consistency 1
confogl_addcvar sv_pure_kick_clients 1
confogl_addcvar sv_voiceenable 1
confogl_addcvar sv_log_onefile 0
confogl_addcvar sv_logbans 1
confogl_addcvar sv_allow_lobby_connect_only 0
confogl_addcvar vs_max_team_switches 9999
confogl_addcvar versus_marker_num 0

// Bandwidth Cvars
exec confogl_rates.cfg

// ReadyUp Cvars
l4d_ready_enabled 1

confogl_addcvar l4d_ready_survivor_freeze 0
confogl_addcvar l4d_ready_delay 3
confogl_addcvar l4d_ready_enable_sound 1
confogl_addcvar l4d_ready_live_sound "ui/survival_medal.wav"

// Config Cvars
confogl_match_execcfg_off           "confogl_off.cfg"               // Execute this config file upon match mode ends.
confogl_match_execcfg_on            "confogl.cfg"                   // Execute this config file upon match mode starts.
confogl_match_killlobbyres          "1"                             // Clear lobby reservation once a match has begun.
confogl_match_restart               "1"                             // Restart the map when the mode is forced (standard confogl behavior).

// Confogl Cvars - Pure keeps everything vanilla (nothing removed / replaced / limited)
confogl_addcvar confogl_boss_tank                   "1"             // Tank won't be prelit/frozen/ghost once a player can take over
confogl_addcvar confogl_boss_unprohibit             "0"             // Don't force bosses on maps that normally don't allow them
confogl_addcvar confogl_lock_boss_spawns            "0"             // Don't lock tank/witch spawn coordinates (vanilla variety)
confogl_addcvar confogl_remove_escape_tank          "0"             // Keep finale escape tanks (vanilla)
confogl_addcvar confogl_disable_tank_hordes         "0"             // Keep natural hordes while tanks are in play (vanilla)
confogl_addcvar confogl_block_punch_rock            "0"             // Allow tank punch+rock at the same time (vanilla)
confogl_addcvar confogl_blockinfectedbots           "0"             // Don't block infected bots
confogl_addcvar director_allow_infected_bots        "1"             // Allow infected bots to fill empty slots (vanilla)
confogl_addcvar confogl_reduce_finalespawnrange     "0"             // Don't alter finale spawn range (vanilla)
confogl_addcvar confogl_remove_chainsaw             "0"             // Keep chainsaws
confogl_addcvar confogl_remove_defib                "0"             // Keep defibrillators
confogl_addcvar confogl_remove_grenade              "0"             // Keep grenade launchers
confogl_addcvar confogl_remove_m60                  "0"             // Keep M60 rifles
confogl_addcvar confogl_remove_lasersight           "0"             // Keep laser sight upgrades
confogl_addcvar confogl_remove_saferoomitems        "0"             // Keep saferoom items
confogl_addcvar confogl_remove_upg_explosive        "0"             // Keep explosive upgrade packs
confogl_addcvar confogl_remove_upg_incendiary       "0"             // Keep incendiary upgrade packs
confogl_addcvar confogl_remove_statickits           "0"             // KEEP in-map static medkits! (eatradish fork cvar spelling: remove_statickits, NO underscore. Default 1 = WeaponInformation kills every map-compiled medkit outside saferoom/finale; this was the real cause of missing in-map kits)
confogl_addcvar confogl_replace_cssweapons          "0"             // Keep CSS weapons as-is
confogl_addcvar confogl_replace_startkits           "0"             // Keep start medkits (don't replace with pills)
confogl_addcvar confogl_replace_finalekits          "0"             // Keep finale medkits
confogl_addcvar confogl_waterslowdown               "0"             // No extra water slowdown
confogl_addcvar confogl_enable_itemtracking         "0"             // Item tracking/limits off (vanilla item spawns)
confogl_addcvar confogl_itemtracking_savespawns     "0"
confogl_addcvar confogl_itemtracking_mapspecific    "0"
confogl_addcvar confogl_adrenaline_limit            "-1"            // Unlimited adrenaline (vanilla)
confogl_addcvar confogl_pipebomb_limit              "-1"            // Unlimited pipe bombs (vanilla)
confogl_addcvar confogl_molotov_limit               "-1"            // Unlimited molotovs (vanilla)
confogl_addcvar confogl_vomitjar_limit              "-1"            // Unlimited bile jars (vanilla)
confogl_addcvar confogl_SM_enable                   "0"             // Vanilla scoring
confogl_addcvar confogl_replace_tier2 0
confogl_addcvar confogl_replace_tier2_finale 0
confogl_addcvar confogl_replace_tier2_all 0
confogl_addcvar confogl_limit_tier2 0
confogl_addcvar confogl_limit_tier2_saferoom 0

// Keep in-map medkits -> leave the engine's item-upgrade cvars at their DEFAULTS
// (director_convert_pills 1 / director_vs_convert_pills 0.5 / critical_health 50 /
// to_defib_health 25). Empirical (2026-09-05): setting them all 0 made in-map kit
// points downgrade to ADRENALINE; engine defaults = same state as manual vanilla
// versus where kits DO appear. So do NOT track/override them in Pure.

// Misc (bugfix / harmless)
confogl_addcvar z_finale_spawn_safety_range 600 // Tank finale bugfix

// Stripper Path - Pure has NO map edits (vanilla maps)
confogl_addcvar stripper_cfg_path cfg/stripper/pure
