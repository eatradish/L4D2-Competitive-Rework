// =======================================================================================
// Pure (纯净对抗) confogl_off.cfg - confogl 离开 pure 模式时执行：
//   1) 空服 ~60s 自动卸载，或
//   2) 管理员 sm_resetmatch，或
//   3) 切到别的模式（sm_fchmatch <other>）。
//
// 这里是标准拆卸（与 zonemod 等模式一致）：pure 的 cvar 与插件全部还原/卸载，
// 服务器回到"无模式"的 pub 状态。**不做任何保活**。
//
// 模式不会因此丢掉 —— plugins/ 根目录的 l4d2_mode_watchdog.smx 会在这两个时机
// 发现"没有模式在跑"，并在服务器没有真人时自动 sm_forcematch pure 把模式完整加载回来：
//   * LGO_OnMatchModeUnloaded（+3s，即本文件执行完之后）
//   * 本文件的 pred_unload_plugins -> sm plugins refresh -> OnAllPluginsLoaded
// 因为 confogl 被 refresh 重新加载，新实例的 RM_bIsPluginsLoaded == false，
// 所以走的是"完整加载"路径（unload_all + 重新 exec 三个 plugins cfg），插件和 cvar
// 一起回来。服务器控制台可见 "Loading plugins and reload self"。
//
// 只保留 reset_static_maps / confogl_resetclientcvars：它们只清 confogl 与插件的内部
// 计数，不涉及插件加载与 cvar 强制值。
// 注：sm_resetstringcount 故意不调 —— 它由 optional/panel_text.smx 提供，pure 不加载
// 该插件，调了只会打 "Unknown command"。
// =======================================================================================

// Disable ReadyUp（标准 confogl 行为；模式重新加载时会自动再打开）
l4d_ready_enabled 0

// Reset Default Common Limit / Static Spawns (witch_and_tankifier bookkeeping only)
reset_static_maps

// Clear tracked client cvar entries (Pure tracks none; tidy-up only)
confogl_resetclientcvars

// Write every confogl_addcvar'd cvar back to the value recorded at mode-load time
confogl_resetcvars

// Unload every plugin (root ones get re-loaded by the following sm plugins refresh)
pred_unload_plugins
