// =======================================================================================
// Pure (纯净对抗) confogl_off.cfg - runs whenever confogl leaves the Pure match mode:
//   1) auto-unload ~60s after the server sits empty, or
//   2) admin sm_resetmatch, or
//   3) switching away to another mode (!match <other>).
//
// 保活 (keep-alive) policy - Pure must NOT be torn down on the empty-server auto-reset:
//   * pred_unload_plugins is NOT run     -> Pure's plugin set (ReadyUp, tank/witch
//     announce, witch_and_tankifier, skill detect, ...) stays loaded.
//   * confogl_resetcvars is NOT run      -> Pure's enforced cvar state stays applied
//     (mp_gamemode "versus", sm_tank_can_spawn 1, l4d_tankdamage_enabled 1, ...).
//   * l4d_ready_enabled stays 1          -> ReadyUp keeps running.
//   * sb_all_bot_game is re-forced to 1  -> confogl's RM_Match_Unload() resets it to 0
//     on the empty-server auto-unload; without this, the engine then demands players on
//     BOTH teams and a lone joiner sees "versus requires both teams" / round never starts
//     (confogl_match_autoload is 0, so match mode is NOT reloaded on connect either).
// Why: predictable_unloader's refresh only reloads plugins/ ROOT; everything Pure uses
// lives in optional/ and fixes/, so the old teardown left the server bare until !match. With
// this file, after the ~60s empty reset only confogl's internal "match loaded" flag
// drops - the server keeps behaving as a full Pure server. Any later !match pure (or
// boot) converges cleanly: mode load does its own load_unlock + unload_all + reload.
// (reset_static_maps / confogl_resetclientcvars are kept - they only clear confogl /
// plugin internal bookkeeping, not plugins or enforced cvars.)
// =======================================================================================

// Keep single-team / bot-filled rounds playable after the empty-server auto-reset.
// RM_Match_Unload() sets this to 0 (see ReqMatch.sp); restore it so a lone player can
// still start a round while the server sits empty-but-awake.
// MUST go through sm_cvar: sb_all_bot_game carries the cheat flag, so a bare
// "sb_all_bot_game 1" is rejected by the engine with
// "Can't use cheat cvar sb_all_bot_game in multiplayer, unless the server has sv_cheats set to 1".
sm_cvar sb_all_bot_game 1

// Reset Default Common Limit / Static Spawns (witch_and_tankifier bookkeeping only).
// NOTE: sm_resetstringcount is deliberately NOT called here - it is provided by
// optional/panel_text.smx, which Pure does not load (that command belongs to the
// zonemod/nextmod plugin set), so it would just print "Unknown command".
reset_static_maps

// Clear tracked client cvar entries (Pure tracks none; tidy-up only)
confogl_resetclientcvars
