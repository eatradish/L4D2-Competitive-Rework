// =======================================================================================
// Pure (纯净对抗) Mode Cvars - settings for the feature plugins loaded by this mode
// =======================================================================================

// [witch_and_tankifier.smx] - Tank & Witch guaranteed every round (versus boss flow)
confogl_addcvar sm_tank_can_spawn 1
confogl_addcvar sm_witch_can_spawn 1
confogl_addcvar sm_witch_avoid_tank_spawn 20 // keep witch away from the tank spawn

// [l4d2_skill_detect.smx] - 连跳速度显示 (chat: "You got N bunnyhops in a row (top speed: X)")
confogl_addcvar sm_skill_report_enable 1     // master switch: report skills in chat
confogl_addcvar sm_skill_report_bhop 1       // report bunnyhop streaks
confogl_addcvar sm_skill_bhopstreak 3        // minimum hops in a row to report
confogl_addcvar sm_skill_bhopinitspeed 150   // min speed of first jump to start a streak
confogl_addcvar sm_skill_bhopkeepspeed 300   // min speed for a hop to still count
// Note: this plugin also reports skeets/crowns/etc. (defaults: level/self-clear/tongue
// cut/deadcharger/instaclear on, most others off). Leave as-is for casual play.

// [l4d2_playstats.smx + survivor_mvp] - 每局结束自动统计 (击杀特感/MVP 等; mirror of BaoKang)
confogl_addcvar sm_survivor_mvp_brevity 0
confogl_addcvar sm_survivor_mvp_brevity_latest 111
confogl_addcvar sm_stats_autoprint_vs_round 8372

// Shared Settings
exec cfgogl/pure/shared_settings.cfg
