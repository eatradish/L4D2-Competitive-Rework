// =======================================================================================
// Pure (纯净对抗) - vanilla-style Versus config.
// Loads NO ZoneMod / competitive gameplay plugins. Keeps ReadyUp + 4 requested features:
//   - damage announce (tank / witch)
//   - tank & witch guaranteed every round
//   - bunnyhop speed display (l4d2_skill_detect)
// =======================================================================================

// ReadyUp Cvars
l4d_ready_cfg_name "Pure Vanilla"

// Confogl Cvars
confogl_addcvar mp_gamemode "versus"   // Force Versus for the config.
confogl_addcvar z_difficulty "normal"  // Force normal difficulty.
confogl_addcvar confogl_pills_limit -1 // Vanilla: pain pills are not limited.

// Pure Shared Cvars (server / rates / readyup / confogl core)
exec cfgogl/pure/shared_cvars.cfg

// Pure Mode Cvars (feature plugins)
exec cfgogl/pure/pure.cfg
