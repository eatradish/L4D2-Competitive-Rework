// =======================================================================================
// Pure (纯净对抗) Shared Settings - cvars for the plugins this mode loads
// =======================================================================================

// [l4d_tank_damage_announce.smx]
confogl_addcvar l4d_tankdamage_enabled 1 // 伤害显示: print each survivor's damage to the Tank

// [l4d_witch_damage_announce.smx]
// 伤害显示: prints damage dealt to the Witch when she dies. Extra options default off:
// confogl_addcvar l4d_wda_print_on_incap 0
// confogl_addcvar l4d_wda_print_minimum 0
// confogl_addcvar l4d_wda_print_max_lines 0

// (l4d2_melee_damage_control is part of the generalfixes fix pack - NOT loaded in Pure)

// Start enforcing all confogl_addcvar values above (incl. mp_gamemode "versus"
// from confogl.cfg). WITHOUT this none of them get applied -> mode runs as coop!
confogl_setcvars
