// =======================================================================================
// Pure (纯净对抗) Shared Settings - cvars for the plugins this mode loads
// =======================================================================================

// [l4d_tank_damage_announce.smx]
confogl_addcvar l4d_tankdamage_enabled 1 // 伤害显示: print each survivor's damage to the Tank

// [l4d_witch_damage_announce.smx]
// 伤害显示: prints damage dealt to the Witch when she dies. Extra options default off:
// confogl_addcvar l4d_wda_print_on_incap 0
// confogl_addcvar l4d_wda_print_minimum 0
// confogl_addcvar l4d_wda_print_max_lines 0

// (l4d2_melee_damage_control is part of the generalfixes fix pack - NOT loaded in Pure)

// [eq_finale_tanks.smx] - Finale tank scheme (matches zonemod/baokang)
// First tank spawns via flow (opening tank), second via the finale event.
tank_map_flow_and_second_event c2m5_concert
tank_map_flow_and_second_event c3m4_plantation
tank_map_flow_and_second_event c8m5_rooftop
tank_map_flow_and_second_event c9m2_lots
tank_map_flow_and_second_event c10m5_houseboat
tank_map_flow_and_second_event c11m5_runway
tank_map_flow_and_second_event c12m5_cornfield
tank_map_flow_and_second_event c14m2_lighthouse
tank_map_flow_and_second_event nmrm5_rooftop

// [lerpmonitor.smx] - 进人时播报 <Lerp> 名字 @ lerp（Pure：只显示，不处理）
confogl_addcvar sm_allowed_lerp_changes 3
confogl_addcvar sm_lerp_change_spec 0    // 0 = 超出修改次数只提示，不移旁观（zm 为 1）
confogl_addcvar sm_readyup_lerp_changes 1
confogl_addcvar sm_min_lerp 0.000
confogl_addcvar sm_max_lerp 0.500        // 放宽到插件允许上限，常见 lerp（含 100）不再被处理（zm 为 0.067）

// [ratemonitor.smx] - 网络参数检查（Pure：只播报提示，不移旁观/不踢）
confogl_addcvar rm_countermeasure 1      // 1 = 仅聊天提示（zm 默认 2 = 移旁观）

// Start enforcing all confogl_addcvar values above (incl. mp_gamemode "versus"
// from confogl.cfg). WITHOUT this none of them get applied -> mode runs as coop!
confogl_setcvars
