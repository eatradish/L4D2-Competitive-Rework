// =======================================================================================
// generalfixes.cfg - UNIVERSAL plugins loaded for EVERY mode (incl. pure / baokang).
// Loaded directly from server.cfg:
//   confogl_match_execcfg_plugins "generalfixes.cfg;confogl_plugins.cfg;sharedplugins.cfg"
// Only mode-independent infra / no-gameplay-change fixes go here.
// Gameplay/balance-affecting fixes live in cfg/compfixes.cfg (competitive modes only).
// =======================================================================================

// Requirements (shared libraries)
sm plugins load left4dhooks.smx
sm plugins load optional/l4d2lib.smx
sm plugins load optional/predictable_unloader.smx

// playermanagement: team/bot fill - must be present before/without a forced mode (all modes)
sm plugins load optional/playermanagement.smx

// General fixes that are safe for ALL modes (no gameplay/balance changes)
sm plugins load fixes/bequiet.smx
sm plugins load fixes/l4d_skip_intro.smx
sm plugins load fixes/command_buffer.smx
sm plugins load fixes/TickrateFixes.smx
sm plugins load fixes/l4d_votepoll_fix.smx
sm plugins load fixes/l4d2_lagcomp_manager.smx
sm plugins load fixes/l4d_console_spam.smx
sm plugins load fixes/l4d2_script_cmd_swap.smx
sm plugins load optional/l4d2_sound_manipulation.smx
sm plugins load l4d_pause_message.smx
sm plugins load fixes/l4d2_hltv_crash_fix.smx
sm plugins load optional/l4d2_map_transitions.smx
sm plugins load fixes/l4d2_fix_team_shuffle.smx
sm plugins load fixes/l4d2_null_cusercmd_fix.smx
sm plugins load fixes/l4d2_fix_changelevel.smx

// Anti-Cheat (universal)
sm plugins load optional/l4d2_block_autoaim.smx // Sort of a cheat..?
sm plugins load anticheat/l4d2_noghostcheat.smx
