// =======================================================================================
// sharedplugins.cfg - extra plugins shared across ALL modes (loaded with every mode).
// Executed after generalfixes.cfg / confogl_plugins.cfg (see server.cfg:
//   confogl_match_execcfg_plugins "generalfixes.cfg;confogl_plugins.cfg;sharedplugins.cfg")
//
// L4D2 admin/debug tools (fbef0102/L4D1_2-Plugins) - all root/BAN-gated, no gameplay change.
// Dependencies must load first.
// =======================================================================================

// Dependencies (shared libraries)
sm plugins load optional/spawn_infected_nolimit.smx     // all4dead2 dependency: spawn SI without director limits
sm plugins load optional/l4d_CreateSurvivorBot.smx      // l4d_wind dependency: spawn survivor bots

// L4D2 admin/debug tools
sm plugins load optional/all4dead2.smx                  // !admin "ALL4DEAD": spawn Tank/Witch/SI/weapons/items, director control (root)
sm plugins load optional/l4d_sm_respawn.smx             // !respawn: revive dead players at crosshair (ban)
sm plugins load optional/admin_hp.smx                   // !hp / !givehp: refill survivor health (root)
sm plugins load optional/l4d_wind.smx                   // sm_addbot + sm_teleport/sm_tp (root/ban)
sm plugins load optional/l4d_team_menu.smx              // admin menu "移动玩家到队伍" + sm_teammenu (kick)
