; =====================================================
; ==     c2m3_coaster: coaster no longer kills SI    ==
; ==   Backport of the zonemod c2m3 fix (everything  ==
; ==   else on this map stays vanilla for Baokang)   ==
; =====================================================
; Vanilla coaster cars (models/props_fairgrounds/coaster_car01.mdl) are solid and
; carry coaster_damage triggers that can crush/kill Special Infected standing on
; or near the track. Make the cars non-solid and drop the damage triggers so SI
; cannot be killed by the ride.

modify:
{
	match:
	{
		"model" "models/props_fairgrounds/coaster_car01.mdl"
	}
	replace:
	{
		"solid" "0"
	}
}
filter:
{
	"targetname" "coaster_damage_1"
}
{
	"targetname" "coaster_damage_2"
}
{
	"targetname" "coaster_damage_3"
}
{
	"targetname" "coaster_damage_4"
}
