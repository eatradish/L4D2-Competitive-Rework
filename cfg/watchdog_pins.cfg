// =======================================================================================
// watchdog_pins.cfg - cvar 钉值清单
//
// 由 l4d2_mode_watchdog.smx 自动执行（sm_watchdog_pins_file 默认就是本文件名）：
//   * 当 sm_watchdog_mode 指定的模式（默认 pure）**正在运行**时，
//   * 在插件加载 / 每图开始 / 模式加载完成后（延迟 2s）。
//
// 语义（思路来自 TouchMe-Inc/l4d2_config_manager 的 config_manager_addcvar）：
//   sm_watchdog_pin <cvar> <value>  设置并"钉住"：记录钉住前的原值，设成新值，
//                                   并 hook 变化 —— 之后任何人/任何机制改动这个 cvar
//                                   （引擎每图 Revert、别的插件、confogl 卸载时的写回）
//                                   都会被立刻顶回钉住的值。
//   sm_watchdog_unpin <cvar>        解除钉住并还原原值
//   sm_watchdog_unpin_all           解除全部并还原
//
// 模式卸载时（LGO_OnMatchModeUnloaded）插件会自动全部解除，所以切模式不会被钉值挡住。
//
// 本文件可以重复 exec（幂等）：已钉过的 cvar 只会把值再压回去，不会覆盖最初记录的原值。
//
// 只列"跟模式无关、但决定服务器形态"的值。模式下值不同的一律不要放这里
// （比如 vs_max_team_switches / sm_max_lerp / versus_boss_flow_* 属于各模式自己的配置）。
// 查看当前状态：sm_watchdog
// =======================================================================================

// 单独一人 / 只有 bot 的局也能开：confogl 卸载时 RM_Match_Unload() 会把它清零，
// 钉住之后连"卸载瞬间"也顶回 1（引擎每图的 sb_ 前缀 Revert 同样被挡）。
// 必须是 sm_watchdog_pin（内部走 ConVar 直接赋值），控制台裸命令会被 sv_cheats 检查拒绝。
sm_watchdog_pin sb_all_bot_game 1

// 服务器形态：允许直连（1 = 只收大厅/匹配，禁直连）
sm_watchdog_pin sv_allow_lobby_connect_only 0

// 空服不休眠：休眠会冻结 SourceMod timer，让看门狗和 confogl 的定时逻辑不可靠
sm_watchdog_pin sv_hibernate_when_empty 0

// 禁止玩家用 wait 脚本
sm_watchdog_pin sv_allow_wait_command 0

// 关闭自动平衡队伍
sm_watchdog_pin mp_autoteambalance 0

// 关闭服务器端 addon 拦截（-1 = 交给 addonconfig.cfg）
sm_watchdog_pin l4d2_addons_eclipse 0
