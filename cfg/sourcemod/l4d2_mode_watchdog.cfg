// =======================================================================================
// l4d2_mode_watchdog.smx - 自动生成/维护的配置文件（插件的 AutoExecConfig）
// 语义与设计说明见 addons/sourcemod/scripting/l4d2_mode_watchdog.sp 头部注释。
// 状态查询：在服务器控制台执行 sm_watchdog
// =======================================================================================

// 0 = 完全关闭看门狗
sm_watchdog_enable "1"

// 要保证一直在跑的模式（cfg/cfgogl/ 下的目录名）；留空 = 只做钉值、不自动加载模式
sm_watchdog_mode "pure"

// 触发后等待多少秒再检查（等插件加载 / sm plugins refresh 收尾）
sm_watchdog_delay "10.0"

// 1 = 只有服务器上没有真人连接时才动手
//     （避免在玩家进服过程中重开图 —— 也就是 confogl 内置 confogl_match_autoload 崩溃的
//      那个场景，见上游 PR #1010 —— 同时避免打断管理员手动切模式）
sm_watchdog_only_empty "1"

// 因为没有真人而被跳过时，多少秒后重试；0 = 不重试（等下一个触发点）
sm_watchdog_retry "30.0"

// 1 = 输出详细日志（LogMessage）
sm_watchdog_debug "0"

// 1 = 模式在跑期间钉住 cfg/watchdog_pins.cfg 里列出的 cvar
sm_watchdog_pin_enable "1"

// 钉值清单文件（相对 cfg/ 的路径）
sm_watchdog_pins_file "watchdog_pins.cfg"
