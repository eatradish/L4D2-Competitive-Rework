// =============================================================================
// l4d2_vote_guard.smx - 自动生成/维护的配置文件（插件的 AutoExecConfig）
// 语义与设计说明见 addons/sourcemod/scripting/l4d2_vote_guard.sp 头部注释。
//
// 它做什么：
//   * 把游戏原生的"投票踢人"（callvote Kick）整个接过来，用 builtinvotes 重发一次
//     —— 显示的是 L4D2 原生投票面板（不是菜单），外观和游戏自带一致。
//   * 拦截时做权限检查：管理员保护 / 免疫等级 / 同队 / 冷却 / 已有投票。
//   * 提供 !veto（取消进行中的投票）和 !votepass（强制通过踢人投票）。
//
// 相关命令：
//   !vk        —— 人人可用的踢人投票入口（不带参数弹选人菜单，也可 !vk <名字|#userid>）
//   !veto      —— 取消进行中的投票
//   !votepass  —— 强制通过进行中的踢人投票
//   （后两个的权限由 sm_voteguard_flag 决定，默认 d）
// =============================================================================

// 0 = 完全关闭接管：踢人投票回到游戏原生流程
//     （此时 !veto / !votepass 仍然可用，但取消不了引擎原生投票 —— 没有接口）
sm_voteguard_enable "1"

// 投票时长（秒）
sm_voteguard_time "30"

// 两次踢人投票之间的最短间隔（秒）
// 投票通过 / 未通过 / 被取消 / 被 !veto 否决，之后都会进入这个冷却
sm_voteguard_delay "30"

// !veto / !votepass 所需的权限 flag（默认 d = Ban）
// 仓库 cfg/sourcemod/admin_groups.cfg 里 "Full Admins" 组已包含 d
sm_voteguard_flag "d"

// 1 = 非管理员不能投票踢管理员
sm_voteguard_protect_admins "1"

// 1 = 免疫等级低的人不能发起踢免疫等级高的人的投票
//     （Full Admins 免疫 99，普通玩家 0，所以普通玩家对管理员必然被拒）
sm_voteguard_immunity "1"

// 1 = 只能投票踢同队玩家（和 compfixes 里 annoyance_exploit_fixes 的规则一致）
//     0 = 允许跨队（游戏原生就允许，想完全还原原生行为再改 0）
sm_voteguard_sameteam "1"

// 1 = 允许投票踢 bot
sm_voteguard_bots "0"

// 1 = 允许观战者发起踢人投票
//     （投票池里不含观战者，所以观战者发起的投票他们自己投不了票）
sm_voteguard_specvote "0"

// 通过规则：
//   0 = 同意票 > 反对票（游戏原生直觉）
//   1 = 同意票 > 可投票人数的一半（readyup / 坦克移交同款严格规则）
sm_voteguard_majority "0"

// 1 = !veto 也能取消其它插件发起的 builtinvotes 投票（readyup / 坦克移交等）
//     0 = !veto 只处理踢人投票
sm_voteguard_veto_any "1"

// 1 = 在聊天框播报"谁发起了投票 / 结果如何 / 谁否决了"
sm_voteguard_announce "1"
